# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/main/uds.schema.json

kind: UDSBundle
metadata:
  name: uds-core-bundle
  description: "Home lab UDS bundle: prerequisite services (MetalLB + cert-manager) plus selected UDS Core functional layers"
  version: "0.1.0"

packages:
  - name: uds-prereq-services
    repository: ghcr.io/sam-delap/uds-prereq-services
    ref: 1.0.1
    optionalComponents:
      - metallb-config
      - cert-manager-config

  - name: core-base
    repository: ghcr.io/defenseunicorns/packages/uds/core-base
    ref: 1.8.0-upstream
    overrides:
      istio-tenant-gateway:
        uds-istio-config:
          values:
            - path: tls.credentialName
              value: gateway-tls
      istio-admin-gateway:
        uds-istio-config:
          values:
            - path: tls.credentialName
              value: admin-gateway-tls

  - name: uds-gateway-certs
    repository: ghcr.io/sam-delap/uds-gateway-certs
    ref: 1.0.0

  - name: core-identity-authorization
    repository: ghcr.io/defenseunicorns/packages/uds/core-identity-authorization
    ref: 1.8.0-upstream
    overrides:
      keycloak:
        keycloak:
          variables:
            # Empty map = embedded devMode. Phase 2 map must be complete (replaces subtree).
            - name: KC_POSTGRESQL
              path: postgresql
              description: "Keycloak external Postgres map (empty = embedded devMode)"
              default: {}

  - name: core-metrics-server
    repository: ghcr.io/defenseunicorns/packages/uds/core-metrics-server
    ref: 1.8.0-upstream

  - name: core-logging
    repository: ghcr.io/defenseunicorns/packages/uds/core-logging
    ref: 1.8.0-upstream

  - name: core-monitoring
    repository: ghcr.io/defenseunicorns/packages/uds/core-monitoring
    ref: 1.8.0-upstream
    overrides:
      grafana:
        grafana:
          variables:
            # Non-secret Grafana postgresql fields (host, database, user, port, ssl_mode,
            # internal). Empty map = embedded SQLite. Phase 2 map must be complete.
            - name: GF_POSTGRESQL
              path: postgresql
              description: "Grafana external Postgres map (empty = embedded SQLite)"
              default: {}
            # Password kept separate + sensitive; source via UDS_GF_PG_PASSWORD, never commit.
            - name: GF_PG_PASSWORD
              path: postgresql.password
              description: "Grafana Postgres password (set via env/--set, not committed)"
              default: ""
              sensitive: true

  - name: postgres-operator
    repository: ghcr.io/uds-packages/postgres-operator
    ref: 1.15.1-uds.5-upstream
    overrides:
      postgres-operator:
        uds-postgres-config:
          variables:
            # Phase 1: no cluster. Phase 2: set true + populate users/databases in uds-config.
            - name: PG_CLUSTER_ENABLED
              path: postgresql.enabled
              description: "Provision the default Postgresql cluster CR"
              default: false
            - name: PG_TEAM_ID
              path: postgresql.teamId
              default: "uds"
            - name: PG_VOLUME_SIZE
              path: postgresql.volume.size
              default: "5Gi"
            - name: PG_INSTANCES
              path: postgresql.numberOfInstances
              default: 2
            - name: PG_VERSION
              path: postgresql.version
              default: "17"
            - name: PG_USERS
              path: postgresql.users
              description: "Map of {namespace}.{username}: [] to create"
              default: {}
            - name: PG_DATABASES
              path: postgresql.databases
              description: "Map of dbname: {namespace}.{username}"
              default: {}
